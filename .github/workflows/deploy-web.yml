name: Deploy web map

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Rebuild when the map code or any data it is generated from changes.
    paths:
      - 'web/**'
      - 'scripts/build_web_data.py'
      - 'data/taipei_feeds/**'
      - 'map-data/admin/**'
      - 'map-data/osm/**'
      - 'map-data/traffic-focus/**'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      # Python version comes from .python-version; dependencies from uv.lock.
      - run: uv sync --locked --no-default-groups
      - name: Generate map layers into web/public/data/
        run: uv run scripts/build_web_data.py
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Type-check and build
        run: npm run build --prefix web
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
