name: Deploy web map

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Rebuild when the map code or any data it is generated from changes.
    paths:
      - 'web/**'
      - 'scripts/build_web_data.py'
      - 'scripts/build_age_catchments.py'
      - 'map-data/population/**'
      - 'tests/test_age_catchments.py'
      - 'tests/test_web_age_stations.py'
      - 'tests/official_cross_city/test_national_villages.py'
      - 'tests/official_cross_city/test_village_age_geography_review.py'
      - 'scripts/review_village_age_geography.py'
      - 'scripts/build_route_scenario.py'
      - 'scripts/build_improvements.py'
      - 'data/urban/public_toilets.geojson'
      - 'data/taipei_feeds/**'
      - 'map-data/admin/**'
      - 'map-data/osm/**'
      - 'map-data/traffic-focus/**'
      - 'data/youbike/**'
      - 'data/population/**'
      - 'data/analysis/**'
      - '.github/workflows/deploy-web.yml'
  # Pull requests only build, to catch failures before they reach main.
  pull_request:
    paths:
      - 'web/**'
      - 'scripts/build_web_data.py'
      - 'scripts/build_age_catchments.py'
      - 'map-data/population/**'
      - 'tests/test_age_catchments.py'
      - 'tests/test_web_age_stations.py'
      - 'tests/official_cross_city/test_national_villages.py'
      - 'tests/official_cross_city/test_village_age_geography_review.py'
      - 'scripts/review_village_age_geography.py'
      - 'scripts/build_route_scenario.py'
      - 'scripts/build_improvements.py'
      - 'data/urban/public_toilets.geojson'
      - 'data/taipei_feeds/**'
      - 'map-data/admin/**'
      - 'map-data/osm/**'
      - 'map-data/traffic-focus/**'
      - 'data/youbike/**'
      - 'data/population/**'
      - 'data/analysis/**'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Deploys queue one at a time; pull-request builds run in their own group.
  group: ${{ github.event_name == 'pull_request' && format('web-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      # Python version comes from .python-version; dependencies from uv.lock.
      - run: uv sync --locked --no-default-groups
      - name: Verify village joins and age allocation with GIS dependencies
        run: |
          uv run python -m unittest discover -s tests/official_cross_city -p 'test_national_villages.py' -v
          uv run python -m unittest discover -s tests/official_cross_city -p 'test_village_age_geography_review.py' -v
          uv run python -m unittest discover -s tests -p 'test_age_catchments.py' -v
          uv run python -m unittest discover -s tests -p 'test_web_age_stations.py' -v
      - name: Generate map layers into web/public/data/
        run: uv run scripts/build_web_data.py
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Verify route scenario calculations
        run: npm run test:routes --prefix web
      - name: Verify population age presentation
        run: npm run test:age --prefix web
      - name: Verify improvement rankings and exports
        run: npm run test:improvements --prefix web
      - name: Type-check and build
        run: npm run build --prefix web
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
