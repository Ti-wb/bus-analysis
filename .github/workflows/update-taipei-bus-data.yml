name: Update Taipei bus data

on:
  workflow_dispatch:
  schedule:
    # Daily 04:17 Asia/Taipei (UTC+8). A snapshot, not continuous ETA history.
    - cron: '17 20 * * *'

permissions:
  contents: read

concurrency:
  group: update-taipei-bus-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      # Python version comes from .python-version; dependencies from uv.lock.
      - run: uv sync --locked --no-default-groups
      - run: uv run python -m unittest discover -s tests -p test_update_data.py -v
      - run: uv run scripts/update_data.py
      - uses: actions/upload-artifact@v7
        with:
          name: taipei-bus-data-${{ github.run_id }}
          # Keep other agents' datasets out of this source-specific artifact.
          path: |
            raw_data/taipei/
            raw_data/pto/
            raw_data/taipei_bus_manifest.json
            data/bus_routes.geojson
            data/bus_stops.geojson
            data/bus_arrivals.json
            data/pto_tables.json
            data/bus_route_statistics.json
            data/bus_operator_statistics.json
            data/taipei_bus_catalog.json
          retention-days: 30
          if-no-files-found: error
